<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>캐릭터 특성 UI 흐름 검사</title>
  </head>
  <body>
    <iframe id="app-frame" title="캐릭터 특성 앱"></iframe>
    <pre id="result">실제 UI 흐름 검사 대기 중</pre>
    <script type="module">
      const STORAGE_KEYS = [
        "tragedy-looper-mastermind:tracker",
        "tragedy-looper:tracker:v1",
        "tragedy-looper-mastermind:tracker:v1",
      ];
      const frame = document.querySelector("#app-frame");
      const result = document.querySelector("#result");
      const originalStorage = new Map(
        STORAGE_KEYS.map((key) => [key, window.localStorage.getItem(key)]),
      );
      const reports = [];
      const failures = [];

      function restoreStorage() {
        for (const [key, value] of originalStorage) {
          if (value === null) window.localStorage.removeItem(key);
          else window.localStorage.setItem(key, value);
        }
      }

      function clearStorage() {
        for (const key of STORAGE_KEYS) window.localStorage.removeItem(key);
      }

      function pause(ms = 30) {
        return new Promise((resolve) => window.setTimeout(resolve, ms));
      }

      async function waitFor(read, description, timeoutMs = 8_000) {
        const startedAt = performance.now();
        while (performance.now() - startedAt < timeoutMs) {
          const value = read();
          if (value) return value;
          await pause();
        }
        throw new Error(`대기 시간 초과: ${description}`);
      }

      function frameDocument() {
        const document = frame.contentDocument;
        if (!document) throw new Error("iframe document를 읽을 수 없습니다.");
        return document;
      }

      function frameWindow() {
        const current = frame.contentWindow;
        if (!current) throw new Error("iframe window를 읽을 수 없습니다.");
        return current;
      }

      function click(selector) {
        const element = frameDocument().querySelector(selector);
        if (!(element instanceof frameWindow().HTMLElement)) {
          throw new Error(`클릭 대상을 찾을 수 없습니다: ${selector}`);
        }
        element.click();
      }

      function changeSelect(selector, value) {
        const select = frameDocument().querySelector(selector);
        if (!(select instanceof frameWindow().HTMLSelectElement)) {
          throw new Error(`선택 대상을 찾을 수 없습니다: ${selector}`);
        }
        select.value = value;
        select.dispatchEvent(new (frameWindow().Event)("change", {
          bubbles: true,
        }));
      }

      function assert(condition, message) {
        if (!condition) failures.push(message);
      }

      async function loadScenario(scenarioId, label) {
        clearStorage();
        const loaded = new Promise((resolve) => {
          frame.addEventListener("load", resolve, { once: true });
        });
        frame.src = `/?trait-flow-case=${encodeURIComponent(label)}`;
        await loaded;
        await waitFor(
          () => frameDocument().querySelector("[data-action='start-selected-scenario']"),
          `${label} 시나리오 선택`,
        );
        changeSelect("[data-new-game-scenario]", scenarioId);
        click("[data-action='start-selected-scenario']");
        await waitFor(
          () => frameDocument().querySelector("[data-action='choose-leader']"),
          `${label} 리더 선택`,
        );
      }

      async function reloadFrame(label) {
        const loaded = new Promise((resolve) => {
          frame.addEventListener("load", resolve, { once: true });
        });
        frame.src = `/?trait-flow-case=${encodeURIComponent(label)}`;
        await loaded;
      }

      function mutateStoredState(scenarioId, mutate) {
        const storageKey = "tragedy-looper-mastermind:tracker";
        const raw = window.localStorage.getItem(storageKey);
        if (raw === null) throw new Error("검사용 저장 상태가 없습니다.");
        const tracker = JSON.parse(raw);
        mutate(tracker.games[scenarioId].state);
        window.localStorage.setItem(storageKey, JSON.stringify(tracker));
      }

      async function openOperationSheet(label) {
        click("[data-action='toggle-operation-sheet']");
        await waitFor(
          () => frameDocument().querySelector(".operation-sheet"),
          label,
        );
      }

      async function copyStateAndWaitForRender(label) {
        click("[data-action='copy-state']");
        await waitFor(
          () => frameDocument().querySelector(".notice-toast"),
          label,
        );
      }

      async function enterRound() {
        click("[data-action='choose-leader']");
        await waitFor(
          () => frameDocument().querySelector("[data-action='continue-loop-start']"),
          "시간의 틈",
        );
        click("[data-action='continue-loop-start']");
        await waitFor(
          () => frameDocument().querySelector(".game-board"),
          "라운드 게임판",
        );
      }

      async function runTimeGapTimerCases() {
        await loadScenario("basicTragedy:4", "time-gap-timer");
        click("[data-action='choose-leader']");
        await waitFor(
          () => frameDocument().querySelector("[data-action='continue-loop-start']"),
          "첫 루프 시간의 틈",
        );

        const firstLoopTitle = frameDocument().querySelector(
          ".time-gap-card h1",
        )?.textContent?.trim();
        assert(firstLoopTitle === "시간의 틈", `첫 루프 제목: ${firstLoopTitle}`);
        assert(
          frameDocument().querySelector(".time-gap-timer") !== null,
          "첫 루프에 시간의 틈 타이머가 표시되지 않음",
        );
        assert(
          frameDocument().querySelector("[data-action='time-gap-start']") !== null,
          "첫 루프에 타이머 조작이 표시되지 않음",
        );

        click("[data-action='time-gap-start']");
        await waitFor(
          () => frameDocument().querySelector("[data-action='time-gap-pause']"),
          "첫 루프 타이머 시작",
        );

        const locationSelect = await waitFor(
          () => frameDocument().querySelector(
            "[data-action='loop-start-trait-location']",
          ),
          "첫 루프 하수인 장소 선택",
        );
        const timer = await waitFor(
          () => frameDocument().querySelector(".time-gap-timer"),
          "첫 루프 타이머",
        );
        const initialTimerText = timer.textContent;
        await waitFor(
          () => timer.textContent !== initialTimerText,
          "타이머 텍스트 직접 갱신",
          3_000,
        );
        assert(
          frameDocument().querySelector("[data-action='loop-start-trait-location']") === locationSelect,
          "타이머 갱신 중 하수인 장소 선택 요소가 교체됨",
        );
        reports.push({
          firstLoopTitle,
          firstLoopTimer: "shown",
          firstLoopSelectPreserved: true,
        });
      }

      async function runDraftInputCases() {
        const goodwillScenario = "basicTragedy:1";
        await loadScenario(goodwillScenario, "goodwill-draft");
        mutateStoredState(goodwillScenario, (state) => {
          state.gamePhase = "ROUND";
          state.loop.phase = "P6_GOODWILL";
          state.loop.board.boyStudent = { status: "alive", at: "School" };
          state.loop.board.girlStudent = { status: "alive", at: "School" };
          state.loop.charCounters.boyStudent.goodwill = 2;
        });
        await reloadFrame("goodwill-draft-ready");
        await openOperationSheet("우호 능력 조작 패널");
        const goodwillSelector =
          '[data-goodwill-target="boyStudent:goodwill:0"]';
        await waitFor(
          () => frameDocument().querySelector(goodwillSelector),
          "우호 능력 대상 선택",
        );
        changeSelect(goodwillSelector, "character:girlStudent");
        await copyStateAndWaitForRender("우호 선택 뒤 상태 복사");
        const goodwillAfterCopy = frameDocument().querySelector(
          goodwillSelector,
        )?.value;
        assert(
          goodwillAfterCopy === "character:girlStudent",
          `상태 복사 뒤 우호 대상: ${goodwillAfterCopy}`,
        );

        const incidentScenario = "basicTragedy:5";
        await loadScenario(incidentScenario, "incident-draft");
        mutateStoredState(incidentScenario, (state) => {
          state.gamePhase = "ROUND";
          state.loop.phase = "P7_INCIDENT";
          state.loop.day = 1;
          state.loop.charCounters.richStudent.paranoia = 99;
        });
        await reloadFrame("incident-draft-ready");
        await openOperationSheet("사건 조작 패널");
        await waitFor(
          () => frameDocument().querySelector('[data-incident-field="target"]'),
          "사건 대상 선택",
        );
        changeSelect('[data-incident-field="target"]', "shrineMaiden");
        changeSelect('[data-incident-field="counter"]', "goodwill");
        await copyStateAndWaitForRender("사건 선택 뒤 상태 복사");
        const incidentTargetAfterCopy = frameDocument().querySelector(
          '[data-incident-field="target"]',
        )?.value;
        const incidentCounterAfterCopy = frameDocument().querySelector(
          '[data-incident-field="counter"]',
        )?.value;
        assert(
          incidentTargetAfterCopy === "shrineMaiden",
          `상태 복사 뒤 사건 대상: ${incidentTargetAfterCopy}`,
        );
        assert(
          incidentCounterAfterCopy === "goodwill",
          `상태 복사 뒤 사건 카운터: ${incidentCounterAfterCopy}`,
        );

        await loadScenario("basicTragedy:1", "final-guess-draft");
        click("[data-action='choose-leader']");
        await waitFor(
          () => frameDocument().querySelector("[data-action='skip-final-guess']"),
          "최후의 싸움 이동",
        );
        click("[data-action='skip-final-guess']");
        await waitFor(
          () => frameDocument().querySelector('[data-final-field="character"]'),
          "최후의 싸움 입력",
        );
        changeSelect('[data-final-field="character"]', "boyStudent");
        changeSelect('[data-final-field="role"]', "person");
        await copyStateAndWaitForRender("최후의 싸움 선택 뒤 상태 복사");
        const finalCharacterAfterCopy = frameDocument().querySelector(
          '[data-final-field="character"]',
        )?.value;
        const finalRoleAfterCopy = frameDocument().querySelector(
          '[data-final-field="role"]',
        )?.value;
        assert(
          finalCharacterAfterCopy === "boyStudent",
          `상태 복사 뒤 최후의 싸움 캐릭터: ${finalCharacterAfterCopy}`,
        );
        assert(
          finalRoleAfterCopy === "person",
          `상태 복사 뒤 최후의 싸움 역할: ${finalRoleAfterCopy}`,
        );

        clearStorage();
        window.localStorage.setItem(
          "tragedy-looper-mastermind:tracker",
          "invalid-json",
        );
        await reloadFrame("new-game-scenario-draft");
        await waitFor(
          () => frameDocument().querySelector("[data-new-game-scenario]"),
          "새 게임 시나리오 선택",
        );
        changeSelect("[data-new-game-scenario]", "basicTragedy:4");
        click("[data-action='dismiss-notice']");
        const scenarioAfterRender = frameDocument().querySelector(
          "[data-new-game-scenario]",
        )?.value;
        assert(
          scenarioAfterRender === "basicTragedy:4",
          `전체 렌더 뒤 새 게임 시나리오: ${scenarioAfterRender}`,
        );

        reports.push({
          goodwillDraft: goodwillAfterCopy,
          incidentDraft: [incidentTargetAfterCopy, incidentCounterAfterCopy],
          finalGuessDraft: [finalCharacterAfterCopy, finalRoleAfterCopy],
          newGameScenarioDraft: scenarioAfterRender,
        });
      }

      async function runExtraLoopCases() {
        const scenarioId = "basicTragedy:1";
        await loadScenario(scenarioId, "extra-loop-house-rule");
        let scriptedLoops;
        mutateStoredState(scenarioId, (state) => {
          scriptedLoops = state.scenario.loops;
          state.loop.loop = scriptedLoops;
          state.gamePhase = "LOOP_JUDGMENT";
          state.loopOutcomes = [{
            loop: scriptedLoops,
            day: state.loop.day,
            reason: "lastDay",
            result: "protagonistsLost",
            losses: [],
          }];
          state.extraLoopsPlayed = 0;
        });
        await reloadFrame("extra-loop-house-rule-ready");

        const extraLoopButton = await waitFor(
          () => frameDocument().querySelector("[data-action='start-extra-loop']"),
          "추가 루프 하우스 룰 버튼",
        );
        assert(
          extraLoopButton.textContent?.includes("추가 루프 (하우스 룰)"),
          `추가 루프 버튼 표기: ${extraLoopButton.textContent}`,
        );
        click("[data-action='start-extra-loop']");
        await waitFor(
          () => frameDocument().querySelector(".time-gap-card"),
          "추가 루프 시간의 틈",
        );

        const expectedLoop = scriptedLoops + 1;
        const roundStatus = frameDocument().querySelector(
          ".round-status",
        )?.textContent?.replace(/\s+/g, " ").trim();
        const timeGapEyebrow = frameDocument().querySelector(
          ".time-gap-card .eyebrow",
        )?.textContent?.trim();
        assert(
          roundStatus?.includes(`${expectedLoop}루프 / ${scriptedLoops}루프 시나리오`),
          `추가 루프 카운터: ${roundStatus}`,
        );
        assert(
          timeGapEyebrow?.includes("추가 루프 (하우스 룰)"),
          `추가 루프 시간의 틈 표기: ${timeGapEyebrow}`,
        );

        mutateStoredState(scenarioId, (state) => {
          state.gamePhase = "GAME_OVER";
          state.result = { winner: "protagonists", reason: "loopVictory" };
        });
        await reloadFrame("extra-loop-house-rule-summary");
        const summary = await waitFor(
          () => frameDocument().querySelector(".game-over-card .flow-warning"),
          "추가 루프 종료 요약",
        );
        assert(
          summary.textContent?.includes("추가 루프 (하우스 룰) · 1회 진행"),
          `추가 루프 종료 요약: ${summary.textContent}`,
        );

        reports.push({
          extraLoopCounter: roundStatus,
          extraLoopLabel: timeGapEyebrow,
          extraLoopSummary: summary.textContent?.trim(),
        });
      }

      async function runGoodwillRefusalUiCases() {
        const scenarioId = "basicTragedy:1";
        const prepareOfficeWorker = (role) => {
          mutateStoredState(scenarioId, (state) => {
            state.gamePhase = "ROUND";
            state.loop.phase = "P6_GOODWILL";
            state.loop.loop = 2;
            state.loop.day = 3;
            state.history = [];
            state.loop.publicInformationThisLoop = [];
            state.loop.abilitiesUsedThisLoop = [];
            state.scenario.cast.officeWorker = role;
            state.loop.charCounters.officeWorker.goodwill = 3;
          });
        };
        const goodwillButton = (character, response) =>
          frameDocument().querySelector(
            `[data-action='goodwill'][data-character='${character}'][data-response='${response}']`,
          );
        const assertOfficeWorkerPolicy = async ({
          role,
          label,
          resolveDisabled,
          refuseDisabled,
          expectedText,
        }) => {
          prepareOfficeWorker(role);
          await reloadFrame(label);
          await openOperationSheet(`${label} 조작 패널`);
          const resolveButton = await waitFor(
            () => goodwillButton("officeWorker", "resolve"),
            `${label} 해결 버튼`,
          );
          const refuseButton = await waitFor(
            () => goodwillButton("officeWorker", "refuse"),
            `${label} 거부 버튼`,
          );
          const cardText = resolveButton.closest(".goodwill-card")
            ?.querySelector(".goodwill-copy span")?.textContent?.trim();
          assert(
            resolveButton.disabled === resolveDisabled,
            `${label} 해결 disabled=${resolveButton.disabled}`,
          );
          assert(
            refuseButton.disabled === refuseDisabled,
            `${label} 거부 disabled=${refuseButton.disabled}`,
          );
          assert(
            cardText?.includes(expectedText),
            `${label} 역할 표기: ${cardText}`,
          );
        };

        await loadScenario(scenarioId, "goodwill-refusal-ui");
        await assertOfficeWorkerPolicy({
          role: "person",
          label: "우호 무시 없음",
          resolveDisabled: false,
          refuseDisabled: true,
          expectedText: "회사원 (엑스트라)",
        });
        await assertOfficeWorkerPolicy({
          role: "killer",
          label: "우호 무시",
          resolveDisabled: false,
          refuseDisabled: false,
          expectedText: "회사원 (살인 청부업자 · 우호 무시)",
        });
        await assertOfficeWorkerPolicy({
          role: "cultist",
          label: "절대 우호 무시",
          resolveDisabled: true,
          refuseDisabled: false,
          expectedText: "회사원 (광신도 · 절대 우호 무시)",
        });

        mutateStoredState(scenarioId, (state) => {
          state.gamePhase = "ROUND";
          state.loop.phase = "P6_GOODWILL";
          state.loop.loop = 2;
          state.loop.day = 3;
          state.history = [];
          state.loop.publicInformationThisLoop = [];
          state.scenario.cast.nurse = "killer";
          state.loop.charCounters.nurse.goodwill = 2;
          state.loop.charCounters.girlStudent.paranoia = 3;
          state.loop.board.girlStudent = { status: "alive", at: "Hospital" };
        });
        await reloadFrame("거부 불가 능력");
        await openOperationSheet("거부 불가 능력 조작 패널");
        const nurseResolve = await waitFor(
          () => goodwillButton("nurse", "resolve"),
          "간호사 해결 버튼",
        );
        const nurseRefuse = await waitFor(
          () => goodwillButton("nurse", "refuse"),
          "간호사 거부 버튼",
        );
        assert(!nurseResolve.disabled, "간호사[2] 해결 버튼이 비활성임");
        assert(nurseRefuse.disabled, "간호사[2] 거부 버튼이 활성임");

        prepareOfficeWorker("killer");
        await reloadFrame("우호 무시 거부 이력");
        await openOperationSheet("우호 무시 거부 이력 조작 패널");
        click("[data-action='goodwill'][data-character='officeWorker'][data-response='refuse']");
        const currentHistory = await waitFor(
          () => frameDocument().querySelector(".goodwill-refusal-log"),
          "현재 루프 거부 이력",
        );
        assert(
          currentHistory.textContent?.includes("회사원") &&
            currentHistory.textContent?.includes("2루프 3일"),
          `현재 루프 거부 이력: ${currentHistory.textContent}`,
        );
        const disclosure = frameDocument().querySelector(
          ".goodwill-refusal-disclosed",
        )?.textContent;
        assert(
          disclosure?.includes("우호 무시 계열 노출"),
          `캐릭터별 노출 표기: ${disclosure}`,
        );

        mutateStoredState(scenarioId, (state) => {
          state.history = [structuredClone(state.loop)];
          state.loop.loop = 3;
          state.loop.day = 1;
          state.loop.publicInformationThisLoop = [];
          state.loop.charCounters.officeWorker.goodwill = 0;
        });
        await reloadFrame("이전 루프 거부 이력");
        await openOperationSheet("이전 루프 거부 이력 조작 패널");
        const pastHistory = await waitFor(
          () => frameDocument().querySelector(".goodwill-refusal-log"),
          "이전 루프 거부 이력",
        );
        assert(
          pastHistory.textContent?.includes("회사원") &&
            pastHistory.textContent?.includes("2루프 3일"),
          `이전 루프 거부 이력: ${pastHistory.textContent}`,
        );

        reports.push({
          goodwillRefusalButtons: "none/optional/mandatory/protected",
          goodwillRefusalHistory: "2루프 3일",
        });
      }

      async function runMysteryBoyCases() {
        const scenarioId = "basicTragedy:7";
        clearStorage();
        await reloadFrame("아웃사이더 시나리오 선택");
        await waitFor(
          () => frameDocument().querySelector("[data-action='start-selected-scenario']"),
          "아웃사이더 시나리오 선택 화면",
        );
        changeSelect("[data-new-game-scenario]", "basicTragedy:18");
        const invalidFanWarning = await waitFor(
          () => frameDocument().querySelector(".scenario-validation-warning"),
          "팬 제작 아웃사이더 규칙 위반 경고",
        );
        const invalidFanStart = frameDocument().querySelector(
          "[data-action='start-selected-scenario']",
        );
        assert(
          frameDocument().querySelector(".scenario-source-summary")
            ?.textContent?.includes("팬 제작"),
          "Trouble in Paradise 출처가 팬 제작으로 표시되지 않음",
        );
        assert(
          invalidFanWarning.textContent?.includes("팬 제작 시나리오 규칙 위반") &&
            invalidFanWarning.textContent.includes("엑스트라 역할을 배정할 수 없습니다"),
          `팬 제작 규칙 위반 안내: ${invalidFanWarning.textContent}`,
        );
        assert(
          invalidFanStart?.disabled,
          "규칙 위반 팬 제작 시나리오의 게임 시작 버튼이 활성임",
        );

        changeSelect("[data-new-game-scenario]", scenarioId);
        const validFanStart = frameDocument().querySelector(
          "[data-action='start-selected-scenario']",
        );
        assert(
          frameDocument().querySelector(".scenario-source-summary")
            ?.textContent?.includes("팬 제작"),
          "Un Rerum 출처가 팬 제작으로 표시되지 않음",
        );
        assert(
          frameDocument().querySelector(".scenario-validation-warning") === null,
          "규칙을 준수하는 팬 제작 시나리오에 위반 경고가 표시됨",
        );
        assert(
          validFanStart && !validFanStart.disabled,
          "규칙을 준수하는 팬 제작 시나리오의 게임 시작 버튼이 비활성임",
        );
        const selectionTrait = frameDocument().querySelector(
          ".scenario-trait-notice:not(.scenario-validation-warning)",
        )?.textContent;
        assert(
          selectionTrait?.includes("아웃사이더") &&
            selectionTrait.includes("항상 현재 어느 룰로도 정해지지 않은 역할"),
          `시나리오 선택 아웃사이더 특성: ${selectionTrait}`,
        );
        click("[data-action='start-selected-scenario']");
        await waitFor(
          () => frameDocument().querySelector("[data-action='choose-leader']"),
          "아웃사이더 시나리오 시작",
        );

        mutateStoredState(scenarioId, (state) => {
          state.gamePhase = "ROUND";
          state.loop.phase = "P6_GOODWILL";
          state.loop.loop = 2;
          state.loop.charCounters.mysteryBoy.goodwill = 3;
          state.loop.revealedRoleCharacters = [];
        });
        await reloadFrame("아웃사이더 플레이 중 특성");
        const castRow = [...frameDocument().querySelectorAll(
          ".scenario-cast-list li",
        )].find((row) => row.textContent?.includes("아웃사이더"));
        const assignedRoleLabel = castRow?.querySelector("b")?.textContent?.trim();
        assert(
          castRow?.textContent?.includes(
            "항상 현재 어느 룰로도 정해지지 않은 역할",
          ),
          `각본가 역할 목록 아웃사이더 특성: ${castRow?.textContent}`,
        );

        click(".character-chip[data-character='mysteryBoy']");
        const modalTrait = await waitFor(
          () => frameDocument().querySelector(".character-trait-information"),
          "아웃사이더 상세 특성",
        );
        assert(
          modalTrait.textContent?.includes(
            "항상 현재 어느 룰로도 정해지지 않은 역할",
          ),
          `아웃사이더 상세 특성: ${modalTrait.textContent}`,
        );
        click("[data-action='close-character-modal']");

        await openOperationSheet("아웃사이더 우호3 조작 패널");
        const revealButton = await waitFor(
          () => frameDocument().querySelector(
            "[data-action='goodwill'][data-character='mysteryBoy'][data-response='resolve']",
          ),
          "아웃사이더 우호3 해결",
        );
        assert(!revealButton.disabled, "아웃사이더[우호3] 해결 버튼이 비활성임");
        revealButton.click();
        const publicRole = await waitFor(
          () => frameDocument().querySelector(".public-information"),
          "아웃사이더 역할 공개 결과",
        );
        assert(
          assignedRoleLabel &&
            publicRole.textContent?.includes("아웃사이더의 역할") &&
            publicRole.textContent.includes(assignedRoleLabel),
          `아웃사이더 역할 공개: ${publicRole.textContent} / 배정=${assignedRoleLabel}`,
        );

        await loadScenario(scenarioId, "아웃사이더 최후의 싸움");
        click("[data-action='choose-leader']");
        await waitFor(
          () => frameDocument().querySelector("[data-action='skip-final-guess']"),
          "아웃사이더 최후의 싸움 이동",
        );
        click("[data-action='skip-final-guess']");
        const roleSelect = await waitFor(
          () => frameDocument().querySelector("[data-final-field='role']"),
          "아웃사이더 최후의 싸움 역할 선택",
        );
        const roleValues = [...roleSelect.options].map((option) => option.value);
        assert(
          roleValues.includes("lover"),
          `최후의 싸움 아웃사이더 역할 선택지: ${roleValues.join(",")}`,
        );
        changeSelect("[data-final-field='character']", "mysteryBoy");
        changeSelect("[data-final-field='role']", "lover");
        click("[data-action='submit-final-guess']");
        const finalRow = await waitFor(
          () => frameDocument().querySelector(".final-guess-table tbody tr"),
          "아웃사이더 최후의 싸움 판정",
        );
        assert(
          finalRow.textContent?.includes("아웃사이더") &&
            finalRow.textContent.includes("✓ 정답"),
          `아웃사이더 최후의 싸움 판정: ${finalRow.textContent}`,
        );

        reports.push({
          mysteryBoyTrait: "selection/overlay/modal",
          mysteryBoyReveal: assignedRoleLabel,
          mysteryBoyFinalGuess: "lover/correct",
        });
      }

      async function runCompactActionCardCases() {
        const scenarioId = "basicTragedy:1";
        await loadScenario(scenarioId, "compact-action-cards");
        mutateStoredState(scenarioId, (state) => {
          state.gamePhase = "ROUND";
          state.loop.phase = "P2_MASTERMIND_ACTION";
          state.loop.placed = [];
        });
        await reloadFrame("compact-mastermind-cards");
        await openOperationSheet("각본가 이동 카드 축약");

        const expected = [
          ["moveVertical", "이동↕", "이동↑↓"],
          ["moveHorizontal", "이동↔", "이동←→"],
          ["moveDiagonal", "이동⤢", "대각 이동"],
        ];
        for (const [card, visible, fullName] of expected) {
          const button = await waitFor(
            () => frameDocument().querySelector(
              `.is-mastermind-hand [data-card='${card}']`,
            ),
            `${fullName} 카드`,
          );
          const label = button.querySelector("span");
          assert(label?.textContent?.trim() === visible, `${fullName} 표시: ${label?.textContent}`);
          assert(button.title === fullName, `${fullName} 툴팁: ${button.title}`);
          assert(
            button.getAttribute("aria-label")?.startsWith(fullName),
            `${fullName} 접근성 이름: ${button.getAttribute("aria-label")}`,
          );
          assert(
            label && label.scrollWidth <= label.clientWidth,
            `${fullName} 카드 글자 넘침: ${label?.scrollWidth}/${label?.clientWidth}`,
          );
        }

        mutateStoredState(scenarioId, (state) => {
          state.loop.phase = "P3_PROTAGONIST_ACTION";
          state.loop.placed = [
            {
              owner: "mastermind",
              card: "paranoiaPlus1",
              target: { kind: "character", id: "patient" },
            },
            {
              owner: "mastermind",
              card: "paranoiaMinus1",
              target: { kind: "character", id: "nurse" },
            },
            {
              owner: "mastermind",
              card: "intriguePlus1",
              target: { kind: "location", at: "Shrine" },
            },
          ];
        });
        await reloadFrame("forbid-move-full-name");
        await openOperationSheet("이동 금지 카드 전체 이름");
        const forbidButton = await waitFor(
          () => frameDocument().querySelector(
            ".protagonist-hand.is-current [data-card='forbidMove']",
          ),
          "이동 금지 카드",
        );
        const forbidLabel = forbidButton.querySelector("span");
        assert(
          forbidLabel?.textContent?.trim() === "이동 금지",
          `이동 금지 표시: ${forbidLabel?.textContent}`,
        );
        assert(
          forbidLabel && forbidLabel.scrollWidth <= forbidLabel.clientWidth,
          `이동 금지 글자 넘침: ${forbidLabel?.scrollWidth}/${forbidLabel?.clientWidth}`,
        );
        assert(forbidButton.title === "이동 금지", `이동 금지 툴팁: ${forbidButton.title}`);

        reports.push({
          compactActionCards: expected.map(([card, visible]) => [card, visible]),
          forbidMove: "이동 금지 (overflow 없음)",
        });
      }

      function shrineIntrigue() {
        return frameDocument().querySelector(
          ".location-shrine [data-action='board-location'] strong",
        )?.textContent?.trim();
      }

      async function runBlackCatCases() {
        await loadScenario("basicTragedy:3", "black-cat");
        await enterRound();
        assert(shrineIntrigue()?.endsWith("1"), `검은 고양이 신사 음모: ${shrineIntrigue()}`);

        await loadScenario("basicTragedy:1", "without-black-cat");
        await enterRound();
        assert(shrineIntrigue()?.endsWith("0"), `검은 고양이 없음 신사 음모: ${shrineIntrigue()}`);
        reports.push({ blackCat: "Shrine 1", withoutBlackCat: "Shrine 0" });
      }

      async function runScientistChoice(counter, expectedText) {
        await loadScenario("basicTragedy:15", `scientist-${counter}`);
        click("[data-action='choose-leader']");
        const continueButton = await waitFor(
          () => frameDocument().querySelector("[data-action='continue-loop-start']"),
          `학자 ${counter} 시간의 틈`,
        );
        assert(continueButton.disabled, `학자 ${counter} 미선택인데 진행 버튼 활성`);

        changeSelect("[data-action='loop-start-trait-counter']", counter);
        await waitFor(
          () => {
            const button = frameDocument().querySelector(
              "[data-action='continue-loop-start']",
            );
            return button && !button.disabled ? button : undefined;
          },
          `학자 ${counter} 선택 반영`,
        );
        click("[data-action='continue-loop-start']");
        await waitFor(
          () => frameDocument().querySelector(".game-board"),
          `학자 ${counter} 라운드`,
        );
        const counters = frameDocument().querySelector(
          ".character-chip[data-character='scientist'] .character-chip-counters",
        )?.textContent?.replace(/\s+/g, " ").trim();
        assert(counters === expectedText, `학자 ${counter} 카운터: ${counters}`);
        reports.push({ scientistChoice: counter, counters });
      }

      async function runHenchmanLocationChoice() {
        await loadScenario("basicTragedy:4", "henchman-location");
        click("[data-action='choose-leader']");
        const continueButton = await waitFor(
          () => frameDocument().querySelector("[data-action='continue-loop-start']"),
          "하수인 시간의 틈",
        );
        assert(continueButton.disabled, "하수인 장소 미선택인데 진행 버튼 활성");

        changeSelect("[data-action='loop-start-trait-location']", "Hospital");
        await waitFor(
          () => {
            const button = frameDocument().querySelector(
              "[data-action='continue-loop-start']",
            );
            return button && !button.disabled ? button : undefined;
          },
          "하수인 장소 선택 반영",
        );
        click("[data-action='continue-loop-start']");
        await waitFor(
          () => frameDocument().querySelector(
            ".location-hospital [data-character='henchman']",
          ),
          "하수인 병원 배치",
        );
        const remembered = frameDocument().querySelector(
          ".loop-start-information strong",
        )?.textContent?.trim();
        assert(remembered === "병원", `하수인 시작 장소 표시: ${remembered}`);
        reports.push({ henchmanLocation: "Hospital", remembered });
      }

      async function run() {
        await runTimeGapTimerCases();
        await runDraftInputCases();
        await runExtraLoopCases();
        await runGoodwillRefusalUiCases();
        await runMysteryBoyCases();
        await runCompactActionCardCases();
        await runBlackCatCases();
        await runScientistChoice("paranoia", "우 0 불 1/2 음 0");
        await runScientistChoice("goodwill", "우 1 불 0/2 음 0");
        await runScientistChoice("intrigue", "우 0 불 0/2 음 1");
        await runHenchmanLocationChoice();
        restoreStorage();
        const passed = failures.length === 0;
        const report = { reports, failures };
        window.traitFlowReport = report;
        document.documentElement.dataset.traitFlowResult = passed ? "pass" : "fail";
        result.textContent = `${passed ? "PASS" : "FAIL"}\n${JSON.stringify(report, null, 2)}`;
        if (!passed) {
          throw new Error(`캐릭터 특성 UI 위반: ${JSON.stringify(failures)}`);
        }
      }

      void run().catch((error) => {
        restoreStorage();
        document.documentElement.dataset.traitFlowResult = "fail";
        failures.push(error instanceof Error ? error.message : String(error));
        result.textContent = `FAIL\n${JSON.stringify({ reports, failures }, null, 2)}`;
        console.error(error);
      });
    </script>
  </body>
</html>
