<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>캐릭터 특성 UI 흐름 검사</title>
  </head>
  <body>
    <iframe id="app-frame" title="캐릭터 특성 앱"></iframe>
    <pre id="result">실제 UI 흐름 검사 대기 중</pre>
    <script type="module">
      const STORAGE_KEYS = [
        "tragedy-looper-mastermind:tracker",
        "tragedy-looper:tracker:v1",
        "tragedy-looper-mastermind:tracker:v1",
      ];
      const frame = document.querySelector("#app-frame");
      const result = document.querySelector("#result");
      const originalStorage = new Map(
        STORAGE_KEYS.map((key) => [key, window.localStorage.getItem(key)]),
      );
      const reports = [];
      const failures = [];

      function restoreStorage() {
        for (const [key, value] of originalStorage) {
          if (value === null) window.localStorage.removeItem(key);
          else window.localStorage.setItem(key, value);
        }
      }

      function clearStorage() {
        for (const key of STORAGE_KEYS) window.localStorage.removeItem(key);
      }

      function pause(ms = 30) {
        return new Promise((resolve) => window.setTimeout(resolve, ms));
      }

      async function waitFor(read, description, timeoutMs = 8_000) {
        const startedAt = performance.now();
        while (performance.now() - startedAt < timeoutMs) {
          const value = read();
          if (value) return value;
          await pause();
        }
        throw new Error(`대기 시간 초과: ${description}`);
      }

      function frameDocument() {
        const document = frame.contentDocument;
        if (!document) throw new Error("iframe document를 읽을 수 없습니다.");
        return document;
      }

      function frameWindow() {
        const current = frame.contentWindow;
        if (!current) throw new Error("iframe window를 읽을 수 없습니다.");
        return current;
      }

      function click(selector) {
        const element = frameDocument().querySelector(selector);
        if (!(element instanceof frameWindow().HTMLElement)) {
          throw new Error(`클릭 대상을 찾을 수 없습니다: ${selector}`);
        }
        element.click();
      }

      function changeSelect(selector, value) {
        const select = frameDocument().querySelector(selector);
        if (!(select instanceof frameWindow().HTMLSelectElement)) {
          throw new Error(`선택 대상을 찾을 수 없습니다: ${selector}`);
        }
        select.value = value;
        select.dispatchEvent(new (frameWindow().Event)("change", {
          bubbles: true,
        }));
      }

      function assert(condition, message) {
        if (!condition) failures.push(message);
      }

      async function loadScenario(scenarioId, label) {
        clearStorage();
        const loaded = new Promise((resolve) => {
          frame.addEventListener("load", resolve, { once: true });
        });
        frame.src = `/?trait-flow-case=${encodeURIComponent(label)}`;
        await loaded;
        await waitFor(
          () => frameDocument().querySelector("[data-action='start-selected-scenario']"),
          `${label} 시나리오 선택`,
        );
        changeSelect("[data-new-game-scenario]", scenarioId);
        click("[data-action='start-selected-scenario']");
        await waitFor(
          () => frameDocument().querySelector("[data-action='choose-leader']"),
          `${label} 리더 선택`,
        );
      }

      async function reloadFrame(label) {
        const loaded = new Promise((resolve) => {
          frame.addEventListener("load", resolve, { once: true });
        });
        frame.src = `/?trait-flow-case=${encodeURIComponent(label)}`;
        await loaded;
      }

      function mutateStoredState(scenarioId, mutate) {
        const storageKey = "tragedy-looper-mastermind:tracker";
        const raw = window.localStorage.getItem(storageKey);
        if (raw === null) throw new Error("검사용 저장 상태가 없습니다.");
        const tracker = JSON.parse(raw);
        mutate(tracker.games[scenarioId].state);
        window.localStorage.setItem(storageKey, JSON.stringify(tracker));
      }

      async function openOperationSheet(label) {
        click("[data-action='toggle-operation-sheet']");
        await waitFor(
          () => frameDocument().querySelector(".operation-sheet"),
          label,
        );
      }

      async function copyStateAndWaitForRender(label) {
        click("[data-action='copy-state']");
        await waitFor(
          () => frameDocument().querySelector(".notice-toast"),
          label,
        );
      }

      async function enterRound() {
        click("[data-action='choose-leader']");
        await waitFor(
          () => frameDocument().querySelector("[data-action='continue-loop-start']"),
          "시간의 틈",
        );
        click("[data-action='continue-loop-start']");
        await waitFor(
          () => frameDocument().querySelector(".game-board"),
          "라운드 게임판",
        );
      }

      async function runTimeGapTimerCases() {
        await loadScenario("basicTragedy:4", "time-gap-timer");
        click("[data-action='choose-leader']");
        await waitFor(
          () => frameDocument().querySelector("[data-action='continue-loop-start']"),
          "첫 루프 시간의 틈",
        );

        const firstLoopTitle = frameDocument().querySelector(
          ".time-gap-card h1",
        )?.textContent?.trim();
        assert(firstLoopTitle === "시간의 틈", `첫 루프 제목: ${firstLoopTitle}`);
        assert(
          frameDocument().querySelector(".time-gap-timer") !== null,
          "첫 루프에 시간의 틈 타이머가 표시되지 않음",
        );
        assert(
          frameDocument().querySelector("[data-action='time-gap-start']") !== null,
          "첫 루프에 타이머 조작이 표시되지 않음",
        );

        click("[data-action='time-gap-start']");
        await waitFor(
          () => frameDocument().querySelector("[data-action='time-gap-pause']"),
          "첫 루프 타이머 시작",
        );

        const locationSelect = await waitFor(
          () => frameDocument().querySelector(
            "[data-action='loop-start-trait-location']",
          ),
          "첫 루프 하수인 장소 선택",
        );
        const timer = await waitFor(
          () => frameDocument().querySelector(".time-gap-timer"),
          "첫 루프 타이머",
        );
        const initialTimerText = timer.textContent;
        await waitFor(
          () => timer.textContent !== initialTimerText,
          "타이머 텍스트 직접 갱신",
          3_000,
        );
        assert(
          frameDocument().querySelector("[data-action='loop-start-trait-location']") === locationSelect,
          "타이머 갱신 중 하수인 장소 선택 요소가 교체됨",
        );
        reports.push({
          firstLoopTitle,
          firstLoopTimer: "shown",
          firstLoopSelectPreserved: true,
        });
      }

      async function runDraftInputCases() {
        const goodwillScenario = "basicTragedy:1";
        await loadScenario(goodwillScenario, "goodwill-draft");
        mutateStoredState(goodwillScenario, (state) => {
          state.gamePhase = "ROUND";
          state.loop.phase = "P6_GOODWILL";
          state.loop.board.boyStudent = { status: "alive", at: "School" };
          state.loop.board.girlStudent = { status: "alive", at: "School" };
          state.loop.charCounters.boyStudent.goodwill = 2;
        });
        await reloadFrame("goodwill-draft-ready");
        await openOperationSheet("우호 능력 조작 패널");
        const goodwillSelector =
          '[data-goodwill-target="boyStudent:goodwill:0"]';
        await waitFor(
          () => frameDocument().querySelector(goodwillSelector),
          "우호 능력 대상 선택",
        );
        changeSelect(goodwillSelector, "character:girlStudent");
        await copyStateAndWaitForRender("우호 선택 뒤 상태 복사");
        const goodwillAfterCopy = frameDocument().querySelector(
          goodwillSelector,
        )?.value;
        assert(
          goodwillAfterCopy === "character:girlStudent",
          `상태 복사 뒤 우호 대상: ${goodwillAfterCopy}`,
        );

        const incidentScenario = "basicTragedy:5";
        await loadScenario(incidentScenario, "incident-draft");
        mutateStoredState(incidentScenario, (state) => {
          state.gamePhase = "ROUND";
          state.loop.phase = "P7_INCIDENT";
          state.loop.day = 1;
          state.loop.charCounters.richStudent.paranoia = 99;
        });
        await reloadFrame("incident-draft-ready");
        await openOperationSheet("사건 조작 패널");
        await waitFor(
          () => frameDocument().querySelector('[data-incident-field="target"]'),
          "사건 대상 선택",
        );
        changeSelect('[data-incident-field="target"]', "shrineMaiden");
        changeSelect('[data-incident-field="counter"]', "goodwill");
        await copyStateAndWaitForRender("사건 선택 뒤 상태 복사");
        const incidentTargetAfterCopy = frameDocument().querySelector(
          '[data-incident-field="target"]',
        )?.value;
        const incidentCounterAfterCopy = frameDocument().querySelector(
          '[data-incident-field="counter"]',
        )?.value;
        assert(
          incidentTargetAfterCopy === "shrineMaiden",
          `상태 복사 뒤 사건 대상: ${incidentTargetAfterCopy}`,
        );
        assert(
          incidentCounterAfterCopy === "goodwill",
          `상태 복사 뒤 사건 카운터: ${incidentCounterAfterCopy}`,
        );

        await loadScenario("basicTragedy:1", "final-guess-draft");
        click("[data-action='choose-leader']");
        await waitFor(
          () => frameDocument().querySelector("[data-action='skip-final-guess']"),
          "최후의 싸움 이동",
        );
        click("[data-action='skip-final-guess']");
        await waitFor(
          () => frameDocument().querySelector('[data-final-field="character"]'),
          "최후의 싸움 입력",
        );
        changeSelect('[data-final-field="character"]', "boyStudent");
        changeSelect('[data-final-field="role"]', "person");
        await copyStateAndWaitForRender("최후의 싸움 선택 뒤 상태 복사");
        const finalCharacterAfterCopy = frameDocument().querySelector(
          '[data-final-field="character"]',
        )?.value;
        const finalRoleAfterCopy = frameDocument().querySelector(
          '[data-final-field="role"]',
        )?.value;
        assert(
          finalCharacterAfterCopy === "boyStudent",
          `상태 복사 뒤 최후의 싸움 캐릭터: ${finalCharacterAfterCopy}`,
        );
        assert(
          finalRoleAfterCopy === "person",
          `상태 복사 뒤 최후의 싸움 역할: ${finalRoleAfterCopy}`,
        );

        clearStorage();
        window.localStorage.setItem(
          "tragedy-looper-mastermind:tracker",
          "invalid-json",
        );
        await reloadFrame("new-game-scenario-draft");
        await waitFor(
          () => frameDocument().querySelector("[data-new-game-scenario]"),
          "새 게임 시나리오 선택",
        );
        changeSelect("[data-new-game-scenario]", "basicTragedy:4");
        click("[data-action='dismiss-notice']");
        const scenarioAfterRender = frameDocument().querySelector(
          "[data-new-game-scenario]",
        )?.value;
        assert(
          scenarioAfterRender === "basicTragedy:4",
          `전체 렌더 뒤 새 게임 시나리오: ${scenarioAfterRender}`,
        );

        reports.push({
          goodwillDraft: goodwillAfterCopy,
          incidentDraft: [incidentTargetAfterCopy, incidentCounterAfterCopy],
          finalGuessDraft: [finalCharacterAfterCopy, finalRoleAfterCopy],
          newGameScenarioDraft: scenarioAfterRender,
        });
      }

      function shrineIntrigue() {
        return frameDocument().querySelector(
          ".location-shrine [data-action='board-location'] strong",
        )?.textContent?.trim();
      }

      async function runBlackCatCases() {
        await loadScenario("basicTragedy:3", "black-cat");
        await enterRound();
        assert(shrineIntrigue()?.endsWith("1"), `검은 고양이 신사 음모: ${shrineIntrigue()}`);

        await loadScenario("basicTragedy:1", "without-black-cat");
        await enterRound();
        assert(shrineIntrigue()?.endsWith("0"), `검은 고양이 없음 신사 음모: ${shrineIntrigue()}`);
        reports.push({ blackCat: "Shrine 1", withoutBlackCat: "Shrine 0" });
      }

      async function runScientistChoice(counter, expectedText) {
        await loadScenario("basicTragedy:15", `scientist-${counter}`);
        click("[data-action='choose-leader']");
        const continueButton = await waitFor(
          () => frameDocument().querySelector("[data-action='continue-loop-start']"),
          `학자 ${counter} 시간의 틈`,
        );
        assert(continueButton.disabled, `학자 ${counter} 미선택인데 진행 버튼 활성`);

        changeSelect("[data-action='loop-start-trait-counter']", counter);
        await waitFor(
          () => {
            const button = frameDocument().querySelector(
              "[data-action='continue-loop-start']",
            );
            return button && !button.disabled ? button : undefined;
          },
          `학자 ${counter} 선택 반영`,
        );
        click("[data-action='continue-loop-start']");
        await waitFor(
          () => frameDocument().querySelector(".game-board"),
          `학자 ${counter} 라운드`,
        );
        const counters = frameDocument().querySelector(
          ".character-chip[data-character='scientist'] .character-chip-counters",
        )?.textContent?.replace(/\s+/g, " ").trim();
        assert(counters === expectedText, `학자 ${counter} 카운터: ${counters}`);
        reports.push({ scientistChoice: counter, counters });
      }

      async function runHenchmanLocationChoice() {
        await loadScenario("basicTragedy:4", "henchman-location");
        click("[data-action='choose-leader']");
        const continueButton = await waitFor(
          () => frameDocument().querySelector("[data-action='continue-loop-start']"),
          "하수인 시간의 틈",
        );
        assert(continueButton.disabled, "하수인 장소 미선택인데 진행 버튼 활성");

        changeSelect("[data-action='loop-start-trait-location']", "Hospital");
        await waitFor(
          () => {
            const button = frameDocument().querySelector(
              "[data-action='continue-loop-start']",
            );
            return button && !button.disabled ? button : undefined;
          },
          "하수인 장소 선택 반영",
        );
        click("[data-action='continue-loop-start']");
        await waitFor(
          () => frameDocument().querySelector(
            ".location-hospital [data-character='henchman']",
          ),
          "하수인 병원 배치",
        );
        const remembered = frameDocument().querySelector(
          ".loop-start-information strong",
        )?.textContent?.trim();
        assert(remembered === "병원", `하수인 시작 장소 표시: ${remembered}`);
        reports.push({ henchmanLocation: "Hospital", remembered });
      }

      async function run() {
        await runTimeGapTimerCases();
        await runDraftInputCases();
        await runBlackCatCases();
        await runScientistChoice("paranoia", "우 0 불 1/2 음 0");
        await runScientistChoice("goodwill", "우 1 불 0/2 음 0");
        await runScientistChoice("intrigue", "우 0 불 0/2 음 1");
        await runHenchmanLocationChoice();
        restoreStorage();
        const passed = failures.length === 0;
        const report = { reports, failures };
        window.traitFlowReport = report;
        document.documentElement.dataset.traitFlowResult = passed ? "pass" : "fail";
        result.textContent = `${passed ? "PASS" : "FAIL"}\n${JSON.stringify(report, null, 2)}`;
        if (!passed) {
          throw new Error(`캐릭터 특성 UI 위반: ${JSON.stringify(failures)}`);
        }
      }

      void run().catch((error) => {
        restoreStorage();
        document.documentElement.dataset.traitFlowResult = "fail";
        failures.push(error instanceof Error ? error.message : String(error));
        result.textContent = `FAIL\n${JSON.stringify({ reports, failures }, null, 2)}`;
        console.error(error);
      });
    </script>
  </body>
</html>
