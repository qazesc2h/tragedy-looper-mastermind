<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>390px 모바일 레이아웃 검사</title>
    <style>
      html, body { margin: 0; background: #111; color: #eee; font-family: monospace; }
      iframe { display: block; width: 390px; height: 844px; border: 0; }
      pre { margin: 0; padding: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <iframe id="app-frame" title="390px 앱 렌더"></iframe>
    <pre id="result">실제 브라우저 렌더 대기 중</pre>
    <script type="module">
      import { characterChipLayoutViolations } from "/src/ui/mobile-layout-check.ts";
      import { misc } from "/src/ui/terms.ts";

      const WIDTH = 390;
      const HEIGHT = 844;
      const MINIMUM_VISIBLE_BOARD_PX = 120;
      const STORAGE_KEYS = [
        "tragedy-looper-mastermind:tracker",
        "tragedy-looper:tracker:v1",
        "tragedy-looper-mastermind:tracker:v1",
      ];
      const frame = document.querySelector("#app-frame");
      const result = document.querySelector("#result");
      const originalStorage = new Map(
        STORAGE_KEYS.map((key) => [key, window.localStorage.getItem(key)]),
      );
      const reports = [];
      const failures = [];

      function restoreStorage() {
        for (const [key, value] of originalStorage) {
          if (value === null) window.localStorage.removeItem(key);
          else window.localStorage.setItem(key, value);
        }
      }

      for (const key of STORAGE_KEYS) window.localStorage.removeItem(key);

      function pause(ms = 50) {
        return new Promise((resolve) => window.setTimeout(resolve, ms));
      }

      async function waitFor(read, description, timeoutMs = 8_000) {
        const startedAt = performance.now();
        while (performance.now() - startedAt < timeoutMs) {
          const value = read();
          if (value) return value;
          await pause();
        }
        throw new Error(`대기 시간 초과: ${description}`);
      }

      function frameDocument() {
        const document = frame.contentDocument;
        if (!document) throw new Error("iframe document를 읽을 수 없습니다.");
        return document;
      }

      function frameWindow() {
        const current = frame.contentWindow;
        if (!current) throw new Error("iframe window를 읽을 수 없습니다.");
        return current;
      }

      function mutateActiveState(mutate) {
        const storageKey = "tragedy-looper-mastermind:tracker";
        const raw = window.localStorage.getItem(storageKey);
        if (raw === null) throw new Error("검사용 저장 상태가 없습니다.");
        const tracker = JSON.parse(raw);
        mutate(tracker.games[tracker.activeScenarioId].state);
        window.localStorage.setItem(storageKey, JSON.stringify(tracker));
      }

      async function reloadApp(label, expectedSelector = ".game-board") {
        const loaded = new Promise((resolve) => {
          frame.addEventListener("load", resolve, { once: true });
        });
        frame.src = `/?mobile-layout-case=${encodeURIComponent(label)}`;
        await loaded;
        await waitFor(
          () => frameDocument().querySelector(expectedSelector),
          `${label} ${expectedSelector}`,
        );
        await frameDocument().fonts.ready;
      }

      function click(selector) {
        const element = frameDocument().querySelector(selector);
        if (!(element instanceof frameWindow().HTMLElement)) {
          throw new Error(`클릭 대상을 찾을 수 없습니다: ${selector}`);
        }
        element.click();
      }

      function locationOf(character) {
        const chip = frameDocument().querySelector(
          `.character-chip[data-character="${character}"]`,
        );
        const location = chip?.closest(".board-location")?.querySelector(
          "[data-action='board-location']",
        );
        return location?.dataset.location;
      }

      async function enterRound() {
        const document = frameDocument();
        const scenarioSelect = document.querySelector("[data-new-game-scenario]");
        if (
          scenarioSelect !== null &&
          !(scenarioSelect instanceof frameWindow().HTMLSelectElement)
        ) {
          throw new Error("시나리오 선택기를 찾을 수 없습니다.");
        }
        if (scenarioSelect) {
          scenarioSelect.value = "basicTragedy:1";
          scenarioSelect.dispatchEvent(new (frameWindow().Event)("change", {
            bubbles: true,
          }));
          await pause();
          document.querySelector("[data-action='start-selected-scenario']")?.click();
          await pause();
        }
        document.querySelector("[data-action='choose-leader']")?.click();
        await pause();
        const henchmanLocation = document.querySelector(
          "[data-action='loop-start-trait-location'][data-character='henchman']",
        );
        if (henchmanLocation) {
          henchmanLocation.value = "Hospital";
          henchmanLocation.dispatchEvent(new (frameWindow().Event)("change", {
            bubbles: true,
          }));
          await pause();
        }
        document.querySelector("[data-action='continue-loop-start']")?.click();
        await waitFor(
          () => frameDocument().querySelector(".game-board"),
          "ROUND 게임판",
        );
        await frameDocument().fonts.ready;
      }

      async function selectScenario(scenarioId) {
        const select = frameDocument().querySelector("[data-action='scenario']");
        if (!(select instanceof frameWindow().HTMLSelectElement)) {
          throw new Error("시나리오 선택기를 찾을 수 없습니다.");
        }
        const option = [...select.options].find(
          (candidate) => candidate.value === scenarioId,
        );
        if (!option) {
          throw new Error(`시나리오를 찾을 수 없습니다: ${scenarioId}`);
        }
        select.value = option.value;
        select.dispatchEvent(new (frameWindow().Event)("change", { bubbles: true }));
        await pause();
        await enterRound();
      }

      async function moveCharacter(character, location) {
        if (locationOf(character) === location) return;
        click(`[data-action='board-character'][data-character="${character}"]`);
        const select = await waitFor(
          () => frameDocument().querySelector(
            `[data-action='move-character'][data-character="${character}"]`,
          ),
          `${character} 이동 선택기`,
        );
        select.value = location;
        select.dispatchEvent(new (frameWindow().Event)("change", { bubbles: true }));
        await waitFor(
          () => locationOf(character) === location,
          `${character} → ${location}`,
        );
        frameDocument().querySelector("[data-action='close-character-modal']")?.click();
        await pause();
      }

      function locationCounts() {
        return [...frameDocument().querySelectorAll(".character-grid")]
          .map((grid) => grid.querySelectorAll(".character-chip-wrap").length);
      }

      function horizontalOverflow() {
        const document = frameDocument();
        return {
          viewportWidth: frameWindow().innerWidth,
          scrollWidth: document.documentElement.scrollWidth,
        };
      }

      function recordBoardLayout(label, expectedCounts) {
        const document = frameDocument();
        const counts = locationCounts();
        const violations = characterChipLayoutViolations(document);
        const horizontal = horizontalOverflow();
        const report = { label, counts, expectedCounts, horizontal, violations };
        reports.push(report);
        if (JSON.stringify(counts) !== JSON.stringify(expectedCounts)) {
          failures.push(`${label}: 인원 분포 ${JSON.stringify(counts)} != ${JSON.stringify(expectedCounts)}`);
        }
        if (violations.length > 0) {
          failures.push(`${label}: 캐릭터 칩 경계 위반 ${JSON.stringify(violations)}`);
        }
        if (horizontal.scrollWidth > WIDTH || horizontal.viewportWidth !== WIDTH) {
          failures.push(`${label}: 가로 폭 ${JSON.stringify(horizontal)}`);
        }
      }

      async function inspectDockAndToast() {
        const document = frameDocument();
        const currentWindow = frameWindow();
        currentWindow.scrollTo(0, document.documentElement.scrollHeight);
        await pause(100);
        const dock = document.querySelector(".operation-dock-bar");
        const footer = document.querySelector(".site-footer");
        if (!dock || !footer) throw new Error("조작 독 또는 페이지 하단을 찾을 수 없습니다.");
        const dockRect = dock.getBoundingClientRect();
        const footerRect = footer.getBoundingClientRect();
        const dockReport = {
          dock: { top: dockRect.top, bottom: dockRect.bottom },
          contentBottom: footerRect.bottom,
          viewportHeight: currentWindow.innerHeight,
        };
        reports.push({ label: "하단 조작 독", ...dockReport });
        if (footerRect.bottom > dockRect.top + 0.5) {
          failures.push(`하단 조작 독이 문서 끝을 가림: ${JSON.stringify(dockReport)}`);
        }
        if (dockRect.bottom > currentWindow.innerHeight + 0.5) {
          failures.push(`하단 조작 독이 뷰포트를 벗어남: ${JSON.stringify(dockReport)}`);
        }

        click("[data-action='copy-state']");
        const toast = await waitFor(
          () => frameDocument().querySelector(".notice-toast"),
          "상태 복사 토스트",
        );
        const toastMessage = toast.querySelector("span");
        if (!toastMessage) throw new Error("토스트 문구 영역을 찾을 수 없습니다.");
        toastMessage.textContent = misc("It is not this player's turn");
        await pause();
        const toastRect = toast.getBoundingClientRect();
        const liveDockRect = frameDocument().querySelector(".operation-dock-bar")
          .getBoundingClientRect();
        const toastReport = {
          message: toastMessage.textContent,
          toast: { top: toastRect.top, bottom: toastRect.bottom },
          dock: { top: liveDockRect.top, bottom: liveDockRect.bottom },
          horizontal: {
            left: toastRect.left,
            right: toastRect.right,
            clientWidth: toast.clientWidth,
            scrollWidth: toast.scrollWidth,
          },
        };
        reports.push({ label: "토스트와 조작 독", ...toastReport });
        if (toastRect.bottom > liveDockRect.top + 0.5) {
          failures.push(`토스트가 조작 독을 가림: ${JSON.stringify(toastReport)}`);
        }
        if (
          toastRect.left < -0.5 || toastRect.right > WIDTH + 0.5 ||
          toast.scrollWidth > toast.clientWidth + 0.5
        ) {
          failures.push(`긴 토스트 문구 가로 넘침: ${JSON.stringify(toastReport)}`);
        }
        frameDocument().querySelector("[data-action='dismiss-notice']")?.click();
        await pause();
      }

      async function inspectStorageActions() {
        const document = frameDocument();
        const currentWindow = frameWindow();
        const details = document.querySelector(".site-footer-details");
        if (!(details instanceof currentWindow.HTMLDetailsElement)) {
          throw new Error("정보 접이식 영역을 찾을 수 없습니다.");
        }
        details.open = true;
        details.scrollIntoView({ block: "end" });
        await pause(100);

        const actions = ["new-game", "delete-all-storage"];
        const confirmations = [];
        currentWindow.confirm = (message) => {
          confirmations.push(message);
          return false;
        };
        for (const action of actions) {
          const button = details.querySelector(`[data-action='${action}']`);
          if (!(button instanceof currentWindow.HTMLButtonElement)) {
            failures.push(`정보 영역 저장 버튼 없음: ${action}`);
            continue;
          }
          const rect = button.getBoundingClientRect();
          const actionReport = {
            action,
            rect: { left: rect.left, right: rect.right, top: rect.top, bottom: rect.bottom },
            width: rect.width,
            height: rect.height,
          };
          reports.push({ label: `정보 영역 ${action}`, ...actionReport });
          if (rect.left < -0.5 || rect.right > WIDTH + 0.5 || rect.height < 44) {
            failures.push(`정보 영역 저장 버튼 경계: ${JSON.stringify(actionReport)}`);
          }
          button.click();
        }
        if (confirmations.length !== actions.length) {
          failures.push(`저장 버튼 확인 호출 ${confirmations.length}/${actions.length}`);
        }
        reports.push({ label: "저장 버튼 확인", confirmations });
        details.open = false;
        await pause();
      }

      async function inspectStorageQuotaContinuation() {
        mutateActiveState((state) => {
          state.gamePhase = "ROUND";
          state.loop.phase = "P4_RESOLVE";
          state.loop.actionResolutionComplete = false;
          state.loop.placed = [
            ["intriguePlus1", "patient", "mastermind"],
            ["paranoiaPlus1", "nurse", "mastermind"],
            ["goodwillPlus1", "shrineMaiden", "mastermind"],
            ["forbidIntrigue", "policeOfficer", 0],
            ["forbidParanoia", "officeWorker", 1],
            ["forbidGoodwill", "boyStudent", 2],
          ].map(([card, id, owner]) => ({
            card,
            target: { kind: "character", id },
            owner,
          }));
          delete state.pendingLoopEnd;
          delete state.loop.pendingImmediateLossKeys;
        });
        await reloadApp("storage-quota-p4");
        const reveal = await waitFor(
          () => frameDocument().querySelector("[data-action='reveal-cards']"),
          "저장 실패 회귀용 카드 공개·해결",
        );
        const currentWindow = frameWindow();
        const storagePrototype = currentWindow.Storage.prototype;
        const originalSetItem = storagePrototype.setItem;
        storagePrototype.setItem = function (key, value) {
          if (key === "tragedy-looper-mastermind:tracker") {
            throw new currentWindow.DOMException(
              "quota exceeded",
              "QuotaExceededError",
            );
          }
          return originalSetItem.call(this, key, value);
        };

        let after;
        let warning;
        try {
          reveal.click();
          const warningElement = await waitFor(
            () => frameDocument().querySelector(".storage-write-warning"),
            "저장 용량 부족 경고",
          );
          after = {
            resultVisible: Boolean(
              frameDocument().querySelector(".resolution-receipt"),
            ),
            nextPhaseEnabled: !frameDocument().querySelector(
              "[data-action='advance']",
            )?.disabled,
          };
          warning = warningElement.textContent.trim();
        } finally {
          storagePrototype.setItem = originalSetItem;
        }

        const report = { after, warning };
        reports.push({ label: "저장 용량 초과 진행 유지", ...report });
        if (
          !after?.resultVisible ||
          !after?.nextPhaseEnabled ||
          warning !== "저장 공간이 부족합니다. 진행은 계속되지만 새로고침하면 복원되지 않습니다"
        ) {
          failures.push(`저장 용량 초과 진행 유지: ${JSON.stringify(report)}`);
        }
        mutateActiveState((state) => {
          state.loop.phase = "P2_MASTERMIND_ACTION";
          state.loop.actionResolutionComplete = false;
          state.loop.placed = [];
        });
        await reloadApp("storage-quota-reset");
      }

      async function inspectResetFlows() {
        const currentWindow = frameWindow();
        const storage = currentWindow.localStorage;
        const savedBefore = JSON.parse(
          storage.getItem("tragedy-looper-mastermind:tracker"),
        );
        const previousScenarioId = savedBefore.activeScenarioId;
        currentWindow.confirm = () => true;

        let details = frameDocument().querySelector(".site-footer-details");
        details.open = true;
        details.querySelector("[data-action='new-game']").click();
        await waitFor(
          () => frameDocument().querySelector("[data-action='start-selected-scenario']"),
          "새 게임 뒤 시나리오 선택 화면",
        );
        const savedAfterNewGame = JSON.parse(
          storage.getItem("tragedy-looper-mastermind:tracker"),
        );
        const newGameReport = {
          activeScenarioId: savedAfterNewGame.activeScenarioId,
          previousScenarioRemoved: !(previousScenarioId in savedAfterNewGame.games),
          selectionVisible: Boolean(
            frameDocument().querySelector("[data-action='start-selected-scenario']"),
          ),
        };
        reports.push({ label: "새 게임 초기화", ...newGameReport });
        if (
          newGameReport.activeScenarioId !== "" ||
          !newGameReport.previousScenarioRemoved ||
          !newGameReport.selectionVisible
        ) {
          failures.push(`새 게임 초기화 실패: ${JSON.stringify(newGameReport)}`);
        }

        storage.setItem("tragedy-looper-mastermind:debug", "delete-me");
        storage.setItem("tragedy-looper-ko:tracker:v1", "keep-ko-data");
        details = frameDocument().querySelector(".site-footer-details");
        details.open = true;
        details.querySelector("[data-action='delete-all-storage']").click();
        await pause();
        const remainingAppKeys = [];
        for (let index = 0; index < storage.length; index += 1) {
          const key = storage.key(index);
          if (key?.startsWith("tragedy-looper-mastermind:")) {
            remainingAppKeys.push(key);
          }
        }
        const deletionReport = {
          remainingAppKeys,
          koreanSiteData: storage.getItem("tragedy-looper-ko:tracker:v1"),
          selectionVisible: Boolean(
            frameDocument().querySelector("[data-action='start-selected-scenario']"),
          ),
        };
        reports.push({ label: "저장 데이터 완전 삭제", ...deletionReport });
        if (
          deletionReport.remainingAppKeys.length > 0 ||
          deletionReport.koreanSiteData !== "keep-ko-data" ||
          !deletionReport.selectionVisible
        ) {
          failures.push(`저장 데이터 완전 삭제 실패: ${JSON.stringify(deletionReport)}`);
        }
      }

      async function inspectOpenCardPanel() {
        const document = frameDocument();
        const board = document.querySelector(".game-board");
        if (!board) throw new Error("카드 패널 검사에서 게임판을 찾을 수 없습니다.");
        board.scrollIntoView({ block: "start" });
        await pause(100);
        click("[data-action='toggle-operation-sheet']");
        const sheet = await waitFor(
          () => frameDocument().querySelector(".operation-sheet"),
          "카드 선택 패널",
        );
        const boardRect = frameDocument().querySelector(".game-board").getBoundingClientRect();
        const sheetRect = sheet.getBoundingClientRect();
        const visibleBoard = Math.max(
          0,
          Math.min(boardRect.bottom, sheetRect.top) - Math.max(boardRect.top, 0),
        );
        const horizontal = horizontalOverflow();
        const panelReport = {
          minimumVisibleBoard: MINIMUM_VISIBLE_BOARD_PX,
          visibleBoard,
          board: { top: boardRect.top, bottom: boardRect.bottom },
          sheet: { top: sheetRect.top, bottom: sheetRect.bottom },
          horizontal,
        };
        reports.push({ label: "카드 선택 패널", ...panelReport });
        if (visibleBoard < MINIMUM_VISIBLE_BOARD_PX) {
          failures.push(`카드 선택 패널 위 게임판 노출 부족: ${JSON.stringify(panelReport)}`);
        }
        if (horizontal.scrollWidth > WIDTH) {
          failures.push(`카드 선택 패널 가로 스크롤: ${JSON.stringify(horizontal)}`);
        }
        click("[data-action='close-operation-sheet']");
        await pause();
      }

      async function inspectP5DisclosurePreview() {
        await selectScenario("firstSteps:4");
        mutateActiveState((state) => {
          state.gamePhase = "ROUND";
          state.loop.phase = "P5_MASTERMIND_ABILITY";
          state.loop.phaseLog = [];
          for (const character of Object.keys(state.scenario.cast)) {
            state.loop.board[character] = {
              status: "alive",
              at: character === "shrineMaiden" ? "Shrine" : "School",
            };
          }
        });
        await reloadApp("p5-disclosure-preview");
        click("[data-action='toggle-operation-sheet']");
        const card = await waitFor(
          () => [...frameDocument().querySelectorAll(".hook-card")].find(
            (candidate) => candidate.textContent.includes("무녀") &&
              candidate.textContent.includes("불안"),
          ),
          "무녀 P5 정보 누출 예고",
        );
        const pendingText = card.textContent.replace(/\s+/g, " ").trim();
        const target = card.querySelector("[data-action='optional-hook-target']");
        if (!(target instanceof frameWindow().HTMLSelectElement)) {
          throw new Error("무녀 P5 대상 선택기를 찾을 수 없습니다.");
        }
        target.value = "character:shrineMaiden";
        target.dispatchEvent(new (frameWindow().Event)("change", {
          bubbles: true,
        }));
        await pause(100);
        const refreshedCard = [...frameDocument().querySelectorAll(".hook-card")]
          .find((candidate) => candidate.textContent.includes("무녀") &&
            candidate.textContent.includes("불안"));
        const previewText = refreshedCard?.textContent
          .replace(/\s+/g, " ").trim() ?? "";
        const preview = refreshedCard?.querySelector(".disclosure-preview");
        const previewRect = preview?.getBoundingClientRect();
        const footerRect = frameDocument().querySelector(
          ".operation-sheet .operation-footer",
        )?.getBoundingClientRect();
        const report = {
          pendingText,
          previewText,
          critical: preview?.classList.contains("risk-critical") ?? false,
          previewRect: previewRect === undefined
            ? undefined
            : { left: previewRect.left, right: previewRect.right },
          footerRect: footerRect === undefined
            ? undefined
            : { top: footerRect.top, bottom: footerRect.bottom },
          horizontal: horizontalOverflow(),
        };
        const checkbox = refreshedCard?.querySelector(
          "[data-action='optional-hook']",
        );
        if (!(checkbox instanceof frameWindow().HTMLInputElement)) {
          throw new Error("무녀 P5 발동 체크박스를 찾을 수 없습니다.");
        }
        checkbox.checked = true;
        checkbox.dispatchEvent(new (frameWindow().Event)("change", {
          bubbles: true,
        }));
        await pause();
        click(".operation-sheet [data-action='advance']");
        await waitFor(
          () => frameDocument().querySelector(".phase-step.is-current strong")
            ?.textContent.includes("우호"),
          "P5 실제 발동 뒤 P6",
        );
        const stored = JSON.parse(window.localStorage.getItem(
          "tragedy-looper-mastermind:tracker",
        ));
        const actualState = stored.games[stored.activeScenarioId].state;
        const actualRoleText = frameDocument().querySelector(
          ".role-deduction-information",
        )?.textContent.replace(/\s+/g, " ").trim() ?? "";
        report.actual = {
          phase: actualState.loop.phase,
          shrineMaidenParanoia:
            actualState.loop.charCounters.shrineMaiden.paranoia,
          abilityRecorded: actualState.loop.phaseLog.some((entry) =>
            entry.kind === "abilityActivated" &&
            entry.timing === "P5_MASTERMIND_ABILITY" &&
            entry.character === "shrineMaiden"
          ),
          roleConfirmed: actualRoleText.includes("무녀 선동가 확정"),
        };
        reports.push({ label: "P5 정보 누출 예고", ...report });
        if (
          !pendingText.includes("미발동") ||
          !pendingText.includes("변화 없음 · 안전") ||
          !pendingText.includes("대상 선택 후 노출 계산") ||
          !previewText.includes("발동 예고") ||
          !previewText.includes("확정 · 위험") ||
          !previewText.includes("무녀 = 선동가 확정") ||
          !report.critical ||
          previewRect === undefined ||
          previewRect.left < -0.5 ||
          previewRect.right > WIDTH + 0.5 ||
          footerRect === undefined ||
          footerRect.bottom > HEIGHT + 0.5 ||
          report.horizontal.scrollWidth > WIDTH ||
          report.actual.phase !== "P6_GOODWILL" ||
          report.actual.shrineMaidenParanoia !== 1 ||
          !report.actual.abilityRecorded ||
          !report.actual.roleConfirmed
        ) {
          failures.push(`P5 정보 누출 예고: ${JSON.stringify(report)}`);
        }
        if (frameDocument().querySelector(".operation-sheet")) {
          click("[data-action='close-operation-sheet']");
          await pause();
        }
      }

            kind: "incidentEffect",

            summaryText: summary?.textContent.replace(/\s+/g, " ").trim() ?? "",

          archiveReports,
        });
        if (!annotation.includes("AI 능력으로 효과 선행 해결됨")) {
          failures.push(`AI 선행 해결 일정 표기: ${annotation}`);
        }

        mutateActiveState((state) => {
          state.gamePhase = "ROUND";
          delete state.result;
          delete state.finalGuess;
        });
        await reloadApp("round-after-archived-information");
      }

      async function inspectScrollableModalBodies() {
        mutateActiveState((state) => {
          state.gamePhase = "ROUND";
          state.loop.phase = "P4_RESOLVE";
          state.loop.actionResolutionComplete = false;
          state.loop.placed = [
            {
              owner: "mastermind",
              card: "moveVertical",
              target: { kind: "character", id: "shrineMaiden" },
            },
            {
              owner: "mastermind",
              card: "intriguePlus1",
              target: { kind: "character", id: "richStudent" },
            },
            {
              owner: "mastermind",
              card: "paranoiaPlus1",
              target: { kind: "character", id: "classRep" },
            },
            {
              owner: 0,
              card: "moveHorizontal",
              target: { kind: "character", id: "informer" },
            },
            {
              owner: 1,
              card: "forbidIntrigue",
              target: { kind: "character", id: "officeWorker" },
            },
            {
              owner: 2,
              card: "goodwillPlus1",
              target: { kind: "character", id: "officeWorker" },
            },
          ];
        });
        await reloadApp("six-card-resolution-modal");
        click("[data-action='toggle-operation-sheet']");
        const sheet = await waitFor(
          () => frameDocument().querySelector(".operation-sheet"),
          "6장 행동 해결 모달",
        );
        const scrollBody = sheet.querySelector(".operation-panel-scroll");
        const footer = sheet.querySelector(".operation-footer");
        const confirmButton = frameDocument().querySelector(
          ".dock-primary[data-action='reveal-cards']",
        );
        if (!scrollBody || !footer || !confirmButton) {
          throw new Error("행동 해결 스크롤 본문·하단 영역·확인 버튼을 찾을 수 없습니다.");
        }
        const placementCount = sheet.querySelectorAll(".placement-group li").length;
        const footerBefore = footer.getBoundingClientRect();
        const confirmBefore = confirmButton.getBoundingClientRect();
        scrollBody.scrollTop = scrollBody.scrollHeight;
        await pause(100);
        const footerAfter = footer.getBoundingClientRect();
        const confirmAfter = confirmButton.getBoundingClientRect();
        const resolutionReport = {
          placementCount,
          overflowY: frameWindow().getComputedStyle(scrollBody).overflowY,
          clientHeight: scrollBody.clientHeight,
          scrollHeight: scrollBody.scrollHeight,
          footerBefore: { top: footerBefore.top, bottom: footerBefore.bottom },
          footerAfter: { top: footerAfter.top, bottom: footerAfter.bottom },
          confirmBefore: { top: confirmBefore.top, bottom: confirmBefore.bottom },
          confirmAfter: { top: confirmAfter.top, bottom: confirmAfter.bottom },
        };
        reports.push({ label: "6장 행동 해결 모달", ...resolutionReport });
        if (placementCount !== 6) {
          failures.push(`행동 해결 배치 요약 ${placementCount}/6`);
        }
        if (
          resolutionReport.overflowY !== "auto" ||
          resolutionReport.scrollHeight <= resolutionReport.clientHeight
        ) {
          failures.push(`행동 해결 본문 세로 스크롤: ${JSON.stringify(resolutionReport)}`);
        }
        if (
          Math.abs(footerBefore.top - footerAfter.top) > 0.5 ||
          Math.abs(confirmBefore.top - confirmAfter.top) > 0.5 ||
          confirmAfter.bottom > HEIGHT + 0.5
        ) {
          failures.push(`행동 해결 하단 고정 실패: ${JSON.stringify(resolutionReport)}`);
        }
        click("[data-action='close-operation-sheet']");
        await pause();

        click("[data-action='board-character'][data-character='shrineMaiden']");
        const detail = await waitFor(
          () => frameDocument().querySelector(".detail-modal"),
          "캐릭터 상세 모달",
        );
        const detailBody = detail.querySelector(".detail-modal-body");
        const detailHeader = detail.querySelector(".detail-modal-header");
        if (!detailBody || !detailHeader) {
          throw new Error("캐릭터 상세 고정 헤더·스크롤 본문을 찾을 수 없습니다.");
        }
        const detailHeaderBefore = detailHeader.getBoundingClientRect();
        detailBody.scrollTop = detailBody.scrollHeight;
        await pause(100);
        const detailHeaderAfter = detailHeader.getBoundingClientRect();
        const detailReport = {
          overflowY: frameWindow().getComputedStyle(detailBody).overflowY,
          clientHeight: detailBody.clientHeight,
          scrollHeight: detailBody.scrollHeight,
          headerBefore: detailHeaderBefore.top,
          headerAfter: detailHeaderAfter.top,
          tags: [...detail.querySelectorAll(".character-tag-information li")]
            .map((element) => element.textContent.trim()),
        };
        reports.push({ label: "캐릭터 상세 모달", ...detailReport });
        if (
          detailReport.overflowY !== "auto" ||
          Math.abs(detailHeaderBefore.top - detailHeaderAfter.top) > 0.5 ||
          detailReport.tags.join(" / ") !== "학생 / 소녀"
        ) {
          failures.push(`캐릭터 상세 스크롤 경계: ${JSON.stringify(detailReport)}`);
        }
        click("[data-action='close-character-modal']");
        await pause();

        mutateActiveState((state) => {
          state.loop.phase = "P6_GOODWILL";
          state.loop.placed = [];
          for (const counters of Object.values(state.loop.charCounters)) {
            counters.goodwill = 10;
          }
        });
        await reloadApp("goodwill-scroll-modal");
        click("[data-action='toggle-operation-sheet']");
        const goodwillScroll = await waitFor(
          () => frameDocument().querySelector(".operation-panel-scroll"),
          "우호 능력 스크롤 본문",
        );
        const goodwillFooter = frameDocument().querySelector(
          ".operation-sheet .operation-footer",
        );
        if (!goodwillFooter) throw new Error("우호 능력 하단 영역을 찾을 수 없습니다.");
        const goodwillFooterBefore = goodwillFooter.getBoundingClientRect();
        goodwillScroll.scrollTop = goodwillScroll.scrollHeight;
        await pause(100);
        const goodwillFooterAfter = goodwillFooter.getBoundingClientRect();
        const goodwillReport = {
          cardCount: frameDocument().querySelectorAll(".goodwill-card").length,
          clientHeight: goodwillScroll.clientHeight,
          scrollHeight: goodwillScroll.scrollHeight,
          footerBefore: goodwillFooterBefore.top,
          footerAfter: goodwillFooterAfter.top,
        };
        reports.push({ label: "우호 능력 목록", ...goodwillReport });
        if (
          goodwillReport.scrollHeight <= goodwillReport.clientHeight ||
          Math.abs(goodwillFooterBefore.top - goodwillFooterAfter.top) > 0.5
        ) {
          failures.push(`우호 능력 목록 스크롤 경계: ${JSON.stringify(goodwillReport)}`);
        }
        click("[data-action='close-operation-sheet']");
        await pause();
      }

      async function inspectAiIncidentChoiceFields() {
        const incidents = [
          "murder",
          "missingPerson",
          "butterflyEffect",
          "farawayMurder",
          "spreading",
          "increasingUnease",
          "suicide",
          "hospitalIncident",
          "foulEvil",
        ];
        mutateActiveState((state) => {
          state.gamePhase = "ROUND";
          state.loop.phase = "P6_GOODWILL";
          state.scenario.cast.ai = "brain";
          state.scenario.incidents = incidents.map((incident, index) => ({
            day: index + 1,
            incident,
            culprit: "boyStudent",
          }));
          state.loop.board.ai = { status: "alive", at: "City" };
          state.loop.charCounters.ai = {
            goodwill: 3,
            paranoia: 0,
            intrigue: 0,
            protection: 0,
          };
        });
        await reloadApp("ai-incident-choice-fields");
        click("[data-action='toggle-operation-sheet']");

        const expected = {
          murder: ["target"],
          missingPerson: ["location"],
          butterflyEffect: ["target", "counter"],
          farawayMurder: ["target"],
          spreading: ["target", "otherTarget"],
          increasingUnease: ["target", "otherTarget"],
          suicide: [],
          hospitalIncident: [],
          foulEvil: [],
        };
        const observed = {};
        for (const [index, incident] of incidents.entries()) {
          const select = await waitFor(
            () => frameDocument().querySelector(
              "[data-goodwill-choice='ai:goodwill:2']",
            ),
            `AI 사건 선택 · ${incident}`,
          );
          select.value = `${index + 1}:${incident}`;
          select.dispatchEvent(new (frameWindow().Event)("change", {
            bubbles: true,
          }));
          await pause();
          const currentSelect = frameDocument().querySelector(
            "[data-goodwill-choice='ai:goodwill:2']",
          );
          const card = currentSelect?.closest(".goodwill-card");
          if (!card) throw new Error("AI 우호3 카드를 찾을 수 없습니다.");
          observed[incident] = [
            card.querySelector("[data-goodwill-incident-target]") && "target",
            card.querySelector("[data-goodwill-incident-other-target]") && "otherTarget",
            card.querySelector("[data-goodwill-incident-location]") && "location",
            card.querySelector("[data-goodwill-incident-counter]") && "counter",
          ].filter(Boolean).sort();
        }
        reports.push({ label: "AI 사건별 선택 필드", observed });
        for (const incident of incidents) {
          const wanted = [...expected[incident]].sort();
          if (JSON.stringify(observed[incident]) !== JSON.stringify(wanted)) {
            failures.push(
              `AI 사건별 선택 · ${incident}: ${JSON.stringify(observed[incident])} != ${JSON.stringify(wanted)}`,
            );
          }
        }
        click("[data-action='close-operation-sheet']");
        await pause();
      }

      async function inspectIllusionActionTrait() {
        mutateActiveState((state) => {
          state.gamePhase = "ROUND";
          state.loop.phase = "P2_MASTERMIND_ACTION";
          state.loop.placed = [];
          delete state.pendingLoopEnd;
          delete state.loop.pendingImmediateLossKeys;
          state.scenario.cast.illusion = "person";
          state.loop.board.illusion = { status: "alive", at: "City" };
          state.loop.charCounters.illusion = {
            goodwill: 0,
            paranoia: 0,
            intrigue: 0,
            protection: 0,
          };
        });
        await reloadApp("illusion-direct-placement");
        click("[data-action='toggle-operation-sheet']");
        click("[data-action='select-hand-card'][data-owner='mastermind'][data-card='paranoiaPlus1']");
        click("[data-action='board-character'][data-character='illusion']");
        const notice = await waitFor(
          () => frameDocument().querySelector(".notice-toast"),
          "환상 직접 배치 금지 안내",
        );
        const directPlacementText = notice.textContent.replace(/\s+/g, " ").trim();
        const afterRejectedPlacement = JSON.parse(
          window.localStorage.getItem("tragedy-looper-mastermind:tracker"),
        );
        const rejectedPlacedCount = afterRejectedPlacement.games[
          afterRejectedPlacement.activeScenarioId
        ].state.loop.placed.length;

        mutateActiveState((state) => {
          state.loop.phase = "P4_RESOLVE";
          state.loop.actionResolutionComplete = false;
          delete state.pendingLoopEnd;
          delete state.loop.pendingImmediateLossKeys;
          state.loop.placed = [
            { owner: "mastermind", card: "paranoiaPlus1", target: { kind: "location", at: "City" } },
            { owner: "mastermind", card: "intriguePlus1", target: { kind: "character", id: "boyStudent" } },
            { owner: "mastermind", card: "goodwillPlus1", target: { kind: "character", id: "girlStudent" } },
            { owner: 0, card: "goodwillPlus1", target: { kind: "character", id: "boyStudent" } },
            { owner: 1, card: "paranoiaPlus1", target: { kind: "character", id: "shrineMaiden" } },
            { owner: 2, card: "moveVertical", target: { kind: "character", id: "officeWorker" } },
          ];
        });
        await reloadApp("illusion-location-card-resolution");
        const revealButton = frameDocument().querySelector(
          ".dock-primary[data-action='reveal-cards']",
        );
        if (!revealButton) throw new Error("환상 P4 공개·해결 버튼을 찾을 수 없습니다.");
        const revealButtonDisabled = revealButton.disabled;
        revealButton.click();
        await pause(300);
        const saved = JSON.parse(
          window.localStorage.getItem("tragedy-looper-mastermind:tracker"),
        );
        const state = saved.games[saved.activeScenarioId].state;
        const report = {
          directPlacementText,
          rejectedPlacedCount,
          revealButtonDisabled,
          placedAfterReveal: state.loop.placed.length,
          noticeAfterReveal: frameDocument().querySelector(".notice-toast")
            ?.textContent.replace(/\s+/g, " ").trim() ?? "",
          paranoiaAfterLocationCard: state.loop.charCounters.illusion.paranoia,
          resultVisible: Boolean(frameDocument().querySelector(".resolution-receipt")),
        };
        reports.push({ label: "환상 행동 카드 특성", ...report });
        if (
          !directPlacementText.includes("직접 놓을 수 없습니다") ||
          rejectedPlacedCount !== 0 ||
          revealButtonDisabled ||
          report.placedAfterReveal !== 0 ||
          report.paranoiaAfterLocationCard !== 1 ||
          !report.resultVisible
        ) {
          failures.push(`환상 행동 카드 특성: ${JSON.stringify(report)}`);
        }
      }

      async function inspectGoodwillImplementationCoverage() {
        mutateActiveState((state) => {
          state.gamePhase = "ROUND";
          state.loop.phase = "P6_GOODWILL";
          state.loop.placed = [];
          delete state.pendingLoopEnd;
          delete state.loop.pendingImmediateLossKeys;
          for (const character of ["forensicSpecialist", "scientist", "illusion"]) {
            state.scenario.cast[character] = "person";
            state.loop.board[character] = { status: "alive", at: "City" };
            state.loop.charCounters[character] = {
              goodwill: 4,
              paranoia: 0,
              intrigue: 0,
              protection: 0,
            };
          }
        });
        await reloadApp("goodwill-implementation-coverage");
        click("[data-action='toggle-operation-sheet']");

        const unsupported = [
          ["forensicSpecialist", "0"],
          ["scientist", "1"],
          ["illusion", "1"],
        ];
        const disabledReasons = {};
        for (const [character, abilityIndex] of unsupported) {
          const button = await waitFor(
            () => frameDocument().querySelector(
              `button[data-action='goodwill'][data-response='resolve'][data-character='${character}'][data-ability-index='${abilityIndex}']`,
            ),
            `미구현 우호 능력 · ${character}:${abilityIndex}`,
          );
          const card = button.closest(".goodwill-card");
          disabledReasons[`${character}:${abilityIndex}`] = {
            disabled: button.disabled,
            reason: card?.querySelector(".goodwill-disabled-reason")
              ?.textContent.trim() ?? "",
          };
        }

        const illusionButton = await waitFor(
          () => frameDocument().querySelector(
            "button[data-action='goodwill'][data-response='resolve'][data-character='illusion'][data-ability-index='2']",
          ),
          "환상 우호4 해결 버튼",
        );
        const illusionRank4InitiallyEnabled = !illusionButton.disabled;
        illusionButton.click();
        await pause(300);
        const saved = JSON.parse(
          window.localStorage.getItem("tragedy-looper-mastermind:tracker"),
        );
        const current = saved.games[saved.activeScenarioId].state;
        const report = {
          disabledReasons,
          illusionRank4InitiallyEnabled,
          illusionStatusAfterResolve: current.loop.board.illusion.status,
          illusionCardVisibleAfterResolve: Boolean(
            frameDocument().querySelector(
              ".goodwill-card button[data-character='illusion']",
            ),
          ),
        };
        reports.push({ label: "우호 능력 구현 경계", ...report });
        if (
          Object.values(disabledReasons).some(
            ({ disabled, reason }) => !disabled || reason !== "미구현",
          ) ||
          !illusionRank4InitiallyEnabled ||
          report.illusionStatusAfterResolve !== "absent" ||
          report.illusionCardVisibleAfterResolve
        ) {
          failures.push(`우호 능력 구현 경계: ${JSON.stringify(report)}`);
        }
      }

      async function run() {
        await enterRound();
        await inspectRuleHypothesisPanels();
        await inspectDeductionTables();
        await inspectLoopPreparationInformation();
        await inspectArchivedInformationAndAiSchedule();

        const starts = {
          patient: "Hospital",
          nurse: "Hospital",
          shrineMaiden: "Shrine",
          policeOfficer: "City",
          officeWorker: "City",
          informer: "City",
          boyStudent: "School",
          girlStudent: "School",
          classRep: "School",
        };
        for (const [character, location] of Object.entries(starts)) {
          await moveCharacter(character, location);
        }
        recordBoardLayout("1~3명 분산", [2, 1, 3, 3]);

        await moveCharacter("officeWorker", "Hospital");
        await moveCharacter("informer", "Hospital");
        recordBoardLayout("한 장소 4명", [4, 1, 1, 3]);
        await inspectStorageActions();
        await inspectStorageQuotaContinuation();
        await inspectDockAndToast();
        await inspectOpenCardPanel();
        await inspectP5DisclosurePreview();
        await inspectP9DisclosurePreview();
        await inspectAiIncidentChoiceFields();
        await inspectIllusionActionTrait();
        await inspectGoodwillImplementationCoverage();
        await selectScenario("basicTragedy:5");
        await inspectScrollableModalBodies();

        await selectScenario("basicTragedy:20");
        const characters = [...frameDocument().querySelectorAll(
          ".character-chip[data-character]",
        )].map((chip) => chip.dataset.character);
        if (characters.length !== 11 || characters.some((character) => !character)) {
          failures.push(`11명 시나리오 캐릭터 수: ${characters.length}`);
        } else {
          for (const character of characters) {
            await moveCharacter(character, "Hospital");
          }
        }
        recordBoardLayout("한 장소 11명", [11, 0, 0, 0]);
        await inspectResetFlows();

        restoreStorage();
        const report = {
          viewport: { width: frameWindow().innerWidth, height: frameWindow().innerHeight },
          reports,
          failures,
        };
        window.mobileLayoutReport = report;
        const passed = failures.length === 0;
        document.documentElement.dataset.layoutResult = passed ? "pass" : "fail";
        result.textContent = `${passed ? "PASS" : "FAIL"}\n${JSON.stringify(report, null, 2)}`;
        if (!passed) throw new Error(`모바일 레이아웃 위반: ${JSON.stringify(failures)}`);
      }

      frame.addEventListener("load", () => {
        void run().catch((error) => {
          restoreStorage();
          document.documentElement.dataset.layoutResult = "fail";
          failures.push(error instanceof Error ? error.message : String(error));
          result.textContent = `FAIL\n${JSON.stringify({ reports, failures }, null, 2)}`;
          console.error(error);
        });
      }, { once: true });
      frame.src = "/";
    </script>
  </body>
</html>
