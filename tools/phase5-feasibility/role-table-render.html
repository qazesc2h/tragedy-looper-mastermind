<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>못된 고양이 역할표 렌더 측정</title>
    <style>
      html, body { margin: 0; background: #111; color: #eee; font-family: monospace; }
      iframe { display: block; width: 390px; height: 844px; border: 0; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <iframe id="app-frame" title="390px 앱 렌더"></iframe>
    <pre id="result">측정 중</pre>
    <script type="module">
      import { collectProtagonistObservations } from "/src/engine/hypothesis.ts";

      const STORAGE_KEY = "tragedy-looper-mastermind:tracker";
      const TIMING_ORIGIN = "http://127.0.0.1:4176";
      const frame = document.querySelector("#app-frame");
      const result = document.querySelector("#result");
      const original = localStorage.getItem(STORAGE_KEY);

      function pause(ms = 30) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function mark(key) {
        await fetch(`${TIMING_ORIGIN}/mark?key=${encodeURIComponent(key)}`);
      }

      async function recordSample(sample) {
        const params = new URLSearchParams(
          Object.entries(sample).map(([key, value]) => [key, String(value)]),
        );
        await fetch(`${TIMING_ORIGIN}/sample?${params}`);
      }

      async function waitFor(read, label, timeout = 10_000) {
        const started = performance.now();
        while (performance.now() - started < timeout) {
          const value = read();
          if (value) return value;
          await pause();
        }
        throw new Error(`대기 시간 초과: ${label}`);
      }

      function frameDocument() {
        if (!frame.contentDocument) throw new Error("iframe document 없음");
        return frame.contentDocument;
      }

      function frameWindow() {
        if (!frame.contentWindow) throw new Error("iframe window 없음");
        return frame.contentWindow;
      }

      async function loadApp(label, selector) {
        const loaded = new Promise((resolve) =>
          frame.addEventListener("load", resolve, { once: true })
        );
        frame.src = `/?role-table-render=${label}-${Math.random()}`;
        await loaded;
        await waitFor(
          () => frameDocument().querySelector(selector),
          `${label} ${selector}`,
        );
        await frameDocument().fonts.ready;
      }

      async function startNaughtyCat() {
        localStorage.removeItem(STORAGE_KEY);
        await loadApp("start", "[data-new-game-scenario]");
        const select = frameDocument().querySelector("[data-new-game-scenario]");
        select.value = "community:naughty-cat";
        select.dispatchEvent(new (frameWindow().Event)("change", { bubbles: true }));
        await pause();
        frameDocument().querySelector("[data-action='start-selected-scenario']").click();
        await pause();
        frameDocument().querySelector("[data-action='choose-leader']")?.click();
        await pause();
        frameDocument().querySelector("[data-action='continue-loop-start']")?.click();
        await waitFor(
          () => frameDocument().querySelector(".game-board"),
          "못된 고양이 게임판",
        );
      }

      function observedAt(loop, day, phase, sequence) {
        return { loop, day, phase, sequence };
      }

      function publicContext(state, loop, day) {
        const locations = ["Hospital", "Shrine", "City", "School"];
        const characters = {};
        Object.keys(state.scenario.cast).forEach((character, index) => {
          const location = character === "popIdol" || character === "patient"
            ? "Hospital"
            : locations[(index + loop + day) % locations.length];
          characters[character] = {
            status: "alive",
            location,
            abilityLocations: [location],
            goodwill: 0,
            paranoia: 0,
            intrigue: 0,
          };
        });
        return {
          locationIntrigue: { Hospital: 0, Shrine: 0, City: 0, School: 0 },
          characters,
        };
      }

      function syntheticLoop(state, loopNumber) {
        const loop = structuredClone(state.loop);
        loop.loop = loopNumber;
        loop.day = 5;
        loop.phase = "P9_ROUND_END";
        loop.roundEndMandatoryResolved = true;
        loop.phaseLog = [];
        loop.roundEvidence = [];
        loop.publicInformationThisLoop = [];
        loop.revealedRoleCharacters = [];
        let sequence = 0;
        for (let day = 1; day <= 5; day += 1) {
          const context = publicContext(state, loopNumber, day);
          loop.phaseLog.push({
            loop: loopNumber,
            day,
            phase: "P5_MASTERMIND_ABILITY",
            kind: "abilityActivated",
            timing: "P5_MASTERMIND_ABILITY",
            character: "popIdol",
            description: "공개 불안 증가",
            publicChanges: [{
              kind: "counter",
              target: { kind: "character", id: "patient" },
              counter: "paranoia",
              delta: 1,
            }],
            publicContext: context,
            observedAt: observedAt(
              loopNumber,
              day,
              "P5_MASTERMIND_ABILITY",
              sequence++,
            ),
          });
          loop.roundEvidence.push({
            day,
            observedAt: observedAt(
              loopNumber,
              day,
              "P9_ROUND_END",
              sequence,
            ),
            roundEndPairs: [{
              location: "Hospital",
              characters: ["popIdol", "patient"],
              paranoia: [0, 0],
              intrigue: [0, 0],
            }],
          });
          sequence += 1;
        }
        for (const incident of state.scenario.incidents) {
          loop.phaseLog.push({
            loop: loopNumber,
            day: incident.day,
            phase: "P7_INCIDENT",
            kind: "incidentJudged",
            incident: incident.incident,
            culprit: incident.culprit,
            fired: false,
            effectApplied: false,
            failureReasons: ["insufficientParanoia"],
            publicContext: publicContext(state, loopNumber, incident.day),
            publicChanges: [],
            deaths: [],
            observedAt: observedAt(
              loopNumber,
              incident.day,
              "P7_INCIDENT",
              sequence++,
            ),
          });
        }
        if (loopNumber > 1) {
          for (const [day, character] of [[2, "patient"], [4, "nurse"]]) {
            loop.phaseLog.push({
              loop: loopNumber,
              day,
              phase: "P4_RESOLVE",
              kind: "actionResolved",
              results: [],
              placements: [{
                owner: 0,
                card: "forbidGoodwill",
                target: { kind: "character", id: character },
              }, {
                owner: 1,
                card: "goodwillPlus1",
                target: { kind: "character", id: character },
              }],
              publicContext: publicContext(state, loopNumber, day),
              publicChanges: [],
              observedAt: observedAt(
                loopNumber,
                day,
                "P4_RESOLVE",
                sequence++,
              ),
            });
          }
        }
        return loop;
      }

      function installState(loopCount) {
        const tracker = JSON.parse(localStorage.getItem(STORAGE_KEY));
        const state = tracker.games[tracker.activeScenarioId].state;
        const loops = Array.from(
          { length: loopCount },
          (_, index) => syntheticLoop(state, index + 1),
        );
        state.gamePhase = "ROUND";
        state.history = loops.slice(0, -1);
        state.loop = loops.at(-1);
        state.loopOutcomes = [];
        delete state.pendingLoopEnd;
        tracker.mastermindOverlay = false;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tracker));
      }

      async function measureOne(loopCount, sample) {
        installState(loopCount);
        await loadApp(`${loopCount}-${sample}`, ".game-board");
        const toggle = frameDocument().querySelector("[data-action='overlay']");
        const key = `${loopCount}-${sample}`;
        await mark(`${key}-baseline-start`);
        await mark(`${key}-baseline-end`);
        await mark(`${key}-render-start`);
        toggle.checked = true;
        toggle.dispatchEvent(new (frameWindow().Event)("change", { bubbles: true }));
        await mark(`${key}-render-end`);
        const overlayElements = frameDocument().querySelectorAll("*").length;
        const overlayHtmlBytes = new TextEncoder().encode(
          frameDocument().documentElement.outerHTML,
        ).length;
        const filterCharacter = "patient";
        frameDocument().querySelector(
          `.character-chip[data-character='${filterCharacter}']`,
        ).click();
        await mark(`${key}-filter-baseline-start`);
        await mark(`${key}-filter-baseline-end`);
        await mark(`${key}-filter-render-start`);
        frameDocument().querySelector(
          "[data-action='show-character-history']",
        ).click();
        await mark(`${key}-filter-render-end`);
        const filterResult = frameDocument().querySelector(
          ".phase-log-filter-result",
        );
        const tracker = JSON.parse(localStorage.getItem(STORAGE_KEY));
        const state = tracker.games[tracker.activeScenarioId].state;
        const observations = collectProtagonistObservations(state).length;
        const measured = {
          milliseconds: 0,
          observations,
          overlayPresent: Boolean(frameDocument().querySelector(
            ".mastermind-overlay",
          )),
          filterResults: Number(filterResult?.dataset.resultCount ?? 0),
          filterBodyPresent: filterResult !== null,
          timingKey: key,
          elements: overlayElements,
          htmlBytes: overlayHtmlBytes,
        };
        await recordSample(measured);
        return measured;
      }

      try {
        await startNaughtyCat();
        const rows = [];
        for (const loopCount of [3, 4, 5]) {
          const samples = [];
          for (let sample = 0; sample < 3; sample += 1) {
            samples.push(await measureOne(loopCount, sample));
          }
          samples.sort((left, right) => left.milliseconds - right.milliseconds);
          rows.push({ loopCount, median: samples[1], samples });
        }
        result.dataset.renderResult = "pass";
        result.textContent = JSON.stringify({ rows }, null, 2);
        await fetch(`${TIMING_ORIGIN}/done`);
      } catch (error) {
        result.dataset.renderResult = "fail";
        result.textContent = error instanceof Error ? error.stack : String(error);
        await fetch(`${TIMING_ORIGIN}/done?error=${encodeURIComponent(
          result.textContent,
        )}`);
      } finally {
        if (original === null) localStorage.removeItem(STORAGE_KEY);
        else localStorage.setItem(STORAGE_KEY, original);
      }
    </script>
  </body>
</html>
